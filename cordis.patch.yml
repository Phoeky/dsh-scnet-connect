# dsh-scnet-connect（SCNet Connect）bundle patch
#
# 把插件本体装进 profile：
#   id   = loader entry id
#   name = npm 包名（loader 用它 import 入口模块）
#
# provider（路由 `scnet`）由 lib/index.js 在 apply() 里动态注册，
# 不在这里写 provider 配置，避免覆盖用户现有的 llm-pi-ai.providers。
#
# 零配置即可用：默认读取本机 SCNet 客户端凭据，自动注册客户端目录里
# 所有 priceLabel=free 的模型（当前是 SCNet-Max）。
# 没装客户端也能用：在设置页用手机短信登录。
- insert:
    - id: scnet-connect
      name: dsh-scnet-connect
      config: {}
      # 全部字段有默认值；需要覆盖时取消对应注释。
        # credentialDir: ''   # 默认 ~/.sclaw/agent/scnet-credentials
        # apiKey: ''          # 留空 = 自动读客户端凭据（填了会明文存在本文件里）
        # baseUrl: 'https://api.scnet.cn/api/llm/v1'
        # modelIds: ''        # 逗号分隔；留空 = 自动注册所有免费模型
        # modelName: ''       # 仅在只注册一个模型时生效
        # contextWindow: 0    # 0 = 跟随客户端目录 / 内置默认
        # maxTokens: 0        # 0 = 跟随客户端目录 / 内置默认
        # inputImages: true
        # reasoning: true
        # verifyWithGateway: true    # 刷新模型时用 GET /models 校验可用性
        # retryOnTransientErrors: true  # 把 5xx 却自称 invalid_request 的抖动改写成可重试错误
        # recordUsage: true       # 记录 token 用量（输入/输出/缓存命中），显示在设置页
        # freeOnly: true           # 只注册免费模型（默认开；设置页切换会覆盖它）
        # credentialSource: auto   # auto | client | login
