# dsh-scnet-connect bundle patch
#
# 这一行负责把插件本体装进 profile：
#   id   = loader entry id（也是设置命名空间名）
#   name = npm 包名（loader 用它 import 入口模块）
#
# 模型 provider（默认路由 `scnet`）由 lib/index.js 在 apply() 里通过
# ctx.llm.registerAdapter 动态注册，不在这里写 provider 配置
# —— 避免整块覆盖用户现有的 llm-pi-ai.providers。
#
# 默认是「零配置」：自动读取本机 SCNet 客户端的 model-service API Key，
# 自动注册客户端模型目录里**所有 priceLabel=free 的模型**（当前是 SCNet-Max），
# 网关地址 https://api.scnet.cn/api/llm/v1。需要调整时再取消注释对应字段。
- insert:
    - id: scnet-connect
      name: dsh-scnet-connect
      config: {}
      # 全部字段都有默认值，上面留空即可；需要覆盖时把对应字段加进 config。
      # 可用字段：
      #   credentialDir / apiKey / baseUrl / modelIds / modelName /
      #   contextWindow / maxTokens / inputImages / reasoning / verifyWithGateway
        # credentialDir: ''   # 默认 ~/.sclaw/agent/scnet-credentials
        # apiKey: ''          # 留空 = 自动读客户端凭据（填了会明文存在本文件里）
        # baseUrl: 'https://api.scnet.cn/api/llm/v1'
        # modelIds: ''        # 逗号分隔；留空 = 自动注册所有免费模型
        # modelName: ''       # 仅在只注册一个模型时生效
        # contextWindow: 0    # 0 = 跟随客户端目录 / 内置默认
        # maxTokens: 0        # 0 = 跟随客户端目录 / 内置默认
        # inputImages: true
        # reasoning: true
        # verifyWithGateway: true  # 刷新模型时用 GET /models 校验可用性
